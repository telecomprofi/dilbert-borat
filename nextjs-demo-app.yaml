apiVersion: v1
kind: Namespace
metadata:
  name: dilbert-borat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dilbert-borat
  namespace: dilbert-borat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dilbert-borat
  template:
    metadata:
      labels:
        app: dilbert-borat
    spec:
      containers:
      - name: dilbert-borat
        image: 097636080304.dkr.ecr.us-east-1.amazonaws.com/service-x/front-end:optimized
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
            ephemeral-storage: "1.5Gi"
          limits:
            cpu: "500m"
            memory: "256Mi"
            ephemeral-storage: "3Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dilbert-borat
  namespace: dilbert-borat
spec:
  selector:
    app: dilbert-borat
  ports:
    - port: 8080
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dilbert-borat
  namespace: dilbert-borat
spec:
  ingressClassName: eks-auto-alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dilbert-borat
                port:
                  number: 8080
